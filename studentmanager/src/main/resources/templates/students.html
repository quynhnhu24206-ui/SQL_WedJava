
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 180px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-add {
            background: #198754;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QUẢN LÝ SINH VIÊN</h1>

    <!-- FORM THÊM SINH VIÊN -->
    <h3>Thêm sinh viên</h3>

    <input type="text" id="studentCode"
           placeholder="Mã sinh viên">

    <input type="text" id="fullName"
           placeholder="Họ và tên">

    <input type="email" id="email"
           placeholder="Email">

    <input type="text" id="phone"
           placeholder="Số điện thoại">

    <input type="text" id="className"
           placeholder="Tên lớp">

    <button class="btn-add" onclick="addStudent()">
        Thêm sinh viên
    </button>

    <!-- DANH SÁCH SINH VIÊN -->
    <h3>Danh sách sinh viên</h3>

    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Số điện thoại</th>
                <th>Lớp</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>

</div>

<script>

    const API_URL = "/api/students";

    // HIỂN THỊ DANH SÁCH
    function loadStudents() {

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {

                const table =
                    document.getElementById("studentTable");

                table.innerHTML = "";

                data.forEach(student => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${student.studentCode}</td>
                        <td>${student.fullName}</td>
                        <td>${student.email}</td>
                        <td>${student.phone}</td>
                        <td>${student.className}</td>
                        <td>
                            <button class="btn-delete"
                                onclick="deleteStudent('${student.id}')">
                                Xóa
                            </button>
                        </td>
                    `;

                    table.appendChild(row);

                });

            })
            .catch(error => {
                console.error("Lỗi tải danh sách:", error);
                alert("Không thể tải danh sách sinh viên!");
            });
    }


    // THÊM SINH VIÊN
    function addStudent() {

        const student = {

            studentCode:
                document.getElementById("studentCode").value,

            fullName:
                document.getElementById("fullName").value,

            email:
                document.getElementById("email").value,

            phone:
                document.getElementById("phone").value,

            className:
                document.getElementById("className").value
        };

        fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(student)

        })
        .then(response => {

            if (!response.ok) {
                throw new Error("Thêm sinh viên thất bại");
            }

            return response.json();

        })
        .then(data => {

            alert("Thêm sinh viên thành công!");

            loadStudents();

            // Xóa dữ liệu trong form
            document.getElementById("studentCode").value = "";
            document.getElementById("fullName").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("className").value = "";

        })
        .catch(error => {

            console.error(error);
            alert("Có lỗi khi thêm sinh viên!");

        });
    }


    // XÓA SINH VIÊN
    function deleteStudent(id) {

        if (!confirm("Bạn có chắc muốn xóa sinh viên này?")) {
            return;
        }

        fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        })
        .then(response => {

            if (!response.ok) {
                throw new Error("Xóa thất bại");
            }

            alert("Xóa sinh viên thành công!");

            loadStudents();

        })
        .catch(error => {

            console.error(error);
            alert("Có lỗi khi xóa sinh viên!");

        });
    }


    // TỰ ĐỘNG TẢI DANH SÁCH KHI MỞ TRANG
    loadStudents();

</script>

</body>
</html>
